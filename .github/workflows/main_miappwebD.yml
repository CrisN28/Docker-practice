# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - miappwebD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://index.docker.io/v1/
        username: ${{ secrets.AzureAppService_ContainerUsername_c2fe0a76259f4928ad6fdbec3aefa00b }}
        password: ${{ secrets.AzureAppService_ContainerPassword_3c5b603b7f8e4638bd5b719d264189a9 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: index.docker.io/${{ secrets.AzureAppService_ContainerUsername_c2fe0a76259f4928ad6fdbec3aefa00b }}/crisn28cr/miappflask:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'miappwebD'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_4c21f68a1f87431ebde1b8ff1b4cec20 }}
        images: 'index.docker.io/${{ secrets.AzureAppService_ContainerUsername_c2fe0a76259f4928ad6fdbec3aefa00b }}/crisn28cr/miappflask:${{ github.sha }}'