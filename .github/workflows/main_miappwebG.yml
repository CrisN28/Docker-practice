name: Deploy existing Docker Hub image to Azure Web App - miappwebG

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'miappwebG'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_b432b0de3078435698c2aa12d2be1ec5 }}
        images: 'crisn28cr/miappflask:latest'
