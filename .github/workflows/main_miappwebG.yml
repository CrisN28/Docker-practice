# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - miappwebG

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://index.docker.io/v1/
        username: ${{ secrets.AzureAppService_ContainerUsername_ee9c9e4d89d54be7b4b53cfb66635bfb }}
        password: ${{ secrets.AzureAppService_ContainerPassword_8573a926e7274a48b677861608f8753b }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: index.docker.io/${{ secrets.AzureAppService_ContainerUsername_ee9c9e4d89d54be7b4b53cfb66635bfb }}/crisn28cr/miappflask:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'miappwebG'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_f70078f0c7484ba19bd89808f256b6b2 }}
        images: 'index.docker.io/${{ secrets.AzureAppService_ContainerUsername_ee9c9e4d89d54be7b4b53cfb66635bfb }}/crisn28cr/miappflask:${{ github.sha }}'